draw_config:
  n_columns: 2
  key_w: 64
  key_h: 58
  split_gap: 34
  outer_pad_w: 32
  outer_pad_h: 42
  append_colon_to_layer_header: false
  shrink_wide_legends: 5
  style_layer_activators: true
  footer_text: Generated from config/cradio.keymap
  svg_extra_style: |
    svg.keymap {
      background-color: #ffffff;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      font-weight: 600;
      text-rendering: optimizeLegibility;
    }
    text.label {
      font-size: 22px;
      font-weight: 750;
    }
    rect.key {
      fill: #f8fafc;
      stroke: #b8c2cf;
      stroke-width: 1.25;
    }
    rect.held, rect.combo.held {
      fill: #dbeafe;
      stroke: #60a5fa;
    }
    text.hold {
      fill: #1d4ed8;
      font-weight: 700;
    }
    rect.trans {
      fill: #f8fafc;
      stroke: #d7dee7;
    }
    text.footer {
      fill: #64748b;
      font-size: 10px;
      font-weight: 500;
    }

parse_config:
  trans_legend: ""
  layer_legend_map:
    Media & Navigation: Nav
    Bluetooth & Mouse: Mouse
    Numbers & Functions: Num/Fn
    Symbols: Sym
  raw_binding_map:
    "&caps_word": Caps Word
    "&mkp MB1": Mouse Left
    "&mkp MB2": Mouse Right
    "&mmv MOVE_LEFT": Mouse Left
    "&mmv MOVE_DOWN": Mouse Down
    "&mmv MOVE_UP": Mouse Up
    "&mmv MOVE_RIGHT": Mouse Right
    "&msc MOVE_LEFT": Scroll Left
    "&msc MOVE_DOWN": Scroll Down
    "&msc MOVE_UP": Scroll Up
    "&msc MOVE_RIGHT": Scroll Right
    "&out OUT_TOG": Output Toggle
    "&bt BT_SEL 0": BT 0
    "&bt BT_SEL 1": BT 1
    "&bt BT_SEL 2": BT 2
    "&bt BT_CLR": BT Clear
